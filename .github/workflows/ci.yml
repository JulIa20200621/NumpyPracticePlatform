name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Same NumPy as the Pyodide release the site loads (see src/worker/pyodide-worker.ts).
      - run: pip install numpy==2.4.6

      - name: exercises.json is up to date
        run: |
          python scripts/parse_ktx.py
          git diff --exit-code src/data/exercises.json

      - name: Verify tests against reference solutions and wrong answers
        run: python scripts/verify_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
